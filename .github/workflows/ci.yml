name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Reuso pela publicação da homologação (publicar só com o CI verde no mesmo commit).
  workflow_call:

# github.workflow entra no grupo: numa chamada via workflow_call vale o nome do workflow que
# chamou, então o CI do push e o CI chamado pela publicação não cancelam um ao outro.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      # Mesmo Postgres + PostGIS do ambiente local, com app_user e banco de teste (docker/postgres).
      # Também sobe o MinIO (S3) e cria o bucket para os testes de armazenamento.
      - name: Subir banco e armazenamento
        run: pnpm infra:up

      - name: Build, tipos e testes
        run: pnpm turbo run build typecheck test
