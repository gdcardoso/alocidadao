name: Publicar homologação

# Push na develop: CI -> imagens (api, web e, se mudou, db) -> deploy no Droplet -> limpeza do ghcr.
on:
  push:
    branches: [develop]

# Uma publicação por vez; a seguinte espera, sem cancelar a que está rodando.
concurrency:
  group: homolog-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Descobre se a imagem do banco precisa ser gerada: compara docker/postgres com o commit da
  # imagem db que está no ar (state/current.env). Sem state ou sem o commit no histórico, gera.
  plan:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homolog
    permissions:
      contents: read
    outputs:
      db_changed: ${{ steps.db.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          {
            echo "Host homolog"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } >~/.ssh/config

      - name: Conferir se a imagem do banco mudou
        id: db
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: |
          changed=true
          db_image="$(ssh -o HostName="$DEPLOY_HOST" homolog \
            "sed -n 's/^DB_IMAGE=//p' /srv/alocidadao/state/current.env 2>/dev/null | tail -n 1" || true)"
          live_sha="${db_image##*:}"
          if [[ "$live_sha" =~ ^[0-9a-f]{7,40}$ ]] && git cat-file -e "$live_sha^{commit}" 2>/dev/null; then
            if git diff --quiet "$live_sha" "$SHA" -- docker/postgres; then
              changed=false
            fi
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          echo "Imagem do banco mudou: $changed"

  images:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/gdcardoso/alocidadao-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Imagem do painel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/gdcardoso/alocidadao-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Imagem do banco
        if: needs.plan.outputs.db_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/gdcardoso/alocidadao-db:${{ github.sha }}
          cache-from: type=gha,scope=db
          cache-to: type=gha,scope=db,mode=max

  deploy:
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homolog
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # SSH direto como o usuário deploy, com verificação estrita da chave do servidor.
      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          {
            echo "Host homolog"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } >~/.ssh/config

      # compose.yml, Caddyfile e scripts vão para /srv/alocidadao antes do deploy.
      # Nunca sobrescreve .env nem state/ (sem --delete, e só esses arquivos são enviados).
      - name: Sincronizar arquivos do servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp deploy/homolog/compose.yml deploy/homolog/Caddyfile "$stage/"
          for f in deploy/scripts/*.sh; do
            [[ "$(basename "$f")" == smoke-local.sh ]] || cp "$f" "$stage/"
          done
          chmod 644 "$stage/compose.yml" "$stage/Caddyfile"
          chmod 755 "$stage"/*.sh
          rsync -rt --chmod=D755 -e "ssh -o HostName=$DEPLOY_HOST" \
            "$stage"/ homolog:/srv/alocidadao/

      - name: Publicar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
          DB_CHANGED: ${{ needs.plan.outputs.db_changed }}
        run: |
          args="$SHA"
          if [[ "$DB_CHANGED" == true ]]; then
            args="$SHA $SHA"
          fi
          ssh -o HostName="$DEPLOY_HOST" homolog "/srv/alocidadao/deploy.sh $args"

  # Apaga do ghcr tudo o que não é a versão no ar nem a anterior (alvo do rollback), lidas de
  # state/current.env e state/previous.env. Se o state não existe ou o SSH falha, não apaga nada.
  prune:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homolog
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          {
            echo "Host homolog"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } >~/.ssh/config

      - name: Apagar versões antigas
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          state="$(ssh -o HostName="$DEPLOY_HOST" homolog \
            "cd /srv/alocidadao/state && cat current.env previous.env")" ||
            { echo "Sem acesso ao state: nada será apagado."; exit 0; }
          for pair in API:alocidadao-api WEB:alocidadao-web DB:alocidadao-db; do
            key="${pair%%:*}_IMAGE"
            package="${pair#*:}"
            mapfile -t tags < <(sed -n "s/^$key=//p" <<<"$state" | sed 's/.*://')
            .github/scripts/prune-ghcr.sh "$OWNER" "$package" "${tags[@]}"
          done
